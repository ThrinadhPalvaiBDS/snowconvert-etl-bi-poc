environment: prod
tenant_id_env: PBI_TENANT_ID
client_id_env: PBI_CLIENT_ID
client_secret_env: PBI_CLIENT_SECRET

snowflake:
  # values pushed into the semantic-model parameters created by repointing
  parameters:
    SnowflakeServer: myorg-myaccount.snowflakecomputing.com
    SnowflakeWarehouse: WH_BI
    SnowflakeDatabase: SALES_DW_PROD
  credential:
    type: Basic                 # Basic (service user) | OAuth2 (Entra SSO configured in UI)
    username_env: PBI_SNOWFLAKE_USER
    password_env: PBI_SNOWFLAKE_PASSWORD

reports:
  - name: Sales Performance
    target_workspace_id: 00000000-0000-0000-0000-000000000000
    pbix_path: powerbi/repointed/Sales Performance.pbix   # saved from SnowConvert's repointed .pbit
    legacy_dataset_id: 11111111-1111-1111-1111-111111111111  # SQL Server model kept for parity tests
    refresh: true
  - name: Customer 360
    target_workspace_id: 00000000-0000-0000-0000-000000000000
    pbix_path: powerbi/repointed/Customer 360.pbix
    legacy_dataset_id: 22222222-2222-2222-2222-222222222222
    refresh: true

dax_parity:
  tolerance_abs: 0.01
  tolerance_pct: 0.0001
  queries_file: powerbi/dax_parity_queries.yaml
