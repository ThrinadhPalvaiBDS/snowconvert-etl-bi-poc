# For local/CI runs. In dbt Projects on Snowflake, auth comes from the executing role,
# but account/database/schema/warehouse values here are still used for the target.
sales_dw:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: TRANSFORMER
      warehouse: WH_TRANSFORM
      database: SALES_DW_DEV
      schema: "{{ env_var('DBT_DEV_SCHEMA_PREFIX', 'DEV') }}"
      threads: 8
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: TRANSFORMER
      warehouse: WH_TRANSFORM
      database: SALES_DW_DEV
      schema: "CI_PR_{{ env_var('PR_NUMBER', '0') }}"
      threads: 8
    cortex:   # RESTRICTED MODE: everything in CORTEX_AI.DATA with the roles you already have
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"
      role: CORTEX_AI_FULL_ACCESS_ROLE
      warehouse: CORTEX_AI_WH
      database: CORTEX_AI
      schema: DATA
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_POC_PIPELINE') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '') }}"
      role: TRANSFORMER
      warehouse: WH_TRANSFORM
      database: SALES_DW_PROD
      schema: MARTS
      threads: 8
